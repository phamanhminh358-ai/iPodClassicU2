name: Build iOS 6 IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Theos, Toolchain & ARMv7 SDK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THEOS: /home/runner/theos
        run: |
          set -e
          sudo apt-get update && sudo apt-get install -y g++ zip curl git unzip make perl xz-utils zstd jq pkg-config libplist-dev libssl-dev

          # 1. Cài ldid (tải binary từ ProcursusTeam, nếu không có sẽ tự biên dịch từ mã nguồn)
          LDID_URL=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/ProcursusTeam/ldid/releases \
            | jq -r '.[0].assets[]? | select(.name | test("linux.*(x86_64|amd64)$"; "i")) | .browser_download_url' | head -n 1)
          if [ -n "$LDID_URL" ] && curl -fsSL "$LDID_URL" -o ldid; then
            chmod +x ldid && sudo mv ldid /usr/local/bin/ldid
          else
            git clone --depth 1 https://github.com/ProcursusTeam/ldid.git /tmp/ldid
            make -C /tmp/ldid -j$(nproc)
            sudo cp /tmp/ldid/ldid /usr/local/bin/ldid
          fi

          # 2. Cài Theos & Toolchain iOS cho Linux x86_64
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/toolchain/linux/iphone" "$THEOS/sdks"

          TOOLCHAIN_URL=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/theos/toolchain/releases \
            | jq -r '.[0].assets[]? | select(.name | test("linux.*(x86_64|amd64)[.](tar[.](xz|zst|gz)|zip)$"; "i")) | .browser_download_url' | head -n 1)
          curl -fsSL "$TOOLCHAIN_URL" -o toolchain.pkg
          case "$TOOLCHAIN_URL" in
            *.zip) unzip -q toolchain.pkg -d "$THEOS/toolchain/linux/iphone" ;;
            *) tar -xf toolchain.pkg -C "$THEOS/toolchain/linux/iphone" ;;
          esac
          CLANG_BIN=$(find "$THEOS/toolchain/linux/iphone" -name "clang" -type f | head -n 1)
          TOOLCHAIN_ROOT=$(dirname "$(dirname "$CLANG_BIN")")
          if [ "$TOOLCHAIN_ROOT" != "$THEOS/toolchain/linux/iphone" ]; then
            mv "$TOOLCHAIN_ROOT/"* "$THEOS/toolchain/linux/iphone/"
          fi
          test -x "$THEOS/toolchain/linux/iphone/bin/clang"

          # 3. Tải riêng iPhoneOS9.3.sdk (hỗ trợ kiến trúc 32-bit armv7 cho iOS 6)
          git clone --depth 1 --filter=blob:none --sparse https://github.com/xybp888/iOS-SDKs.git /tmp/iOS-SDKs
          git -C /tmp/iOS-SDKs sparse-checkout set iPhoneOS9.3.sdk iPhoneOS10.3.sdk
          cp -r /tmp/iOS-SDKs/iPhoneOS*.sdk "$THEOS/sdks/"

      - name: Compile & Package IPA
        env:
          THEOS: /home/runner/theos
        run: |
          set -e
          make FINALPACKAGE=1
          APP_PATH=$(find .theos/obj -name "iPodClassicU2.app" -type d | head -n 1)
          ldid -S "$APP_PATH/iPodClassicU2"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -qr iPodClassicU2.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: iPodClassicU2-IPA
          path: iPodClassicU2.ipa

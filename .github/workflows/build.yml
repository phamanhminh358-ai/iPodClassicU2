name: Build iOS 6 IPA & DEB
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Theos, Toolchain & ARMv7 SDK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THEOS: /home/runner/theos
        run: |
          set -e
          sudo apt-get update && sudo apt-get install -y g++ zip curl git unzip make perl xz-utils zstd jq fakeroot pkg-config libplist-dev libssl-dev dpkg-deb

          # 1. Cài ldid
          LDID_URL=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/ProcursusTeam/ldid/releases \
            | jq -r '[.[].assets[]? | select(.name | test("linux.*(x86_64|amd64)$"; "i")) | .browser_download_url][0] // empty')
          if [ -n "$LDID_URL" ] && curl -fsSL "$LDID_URL" -o ldid; then
            chmod +x ldid && sudo mv ldid /usr/local/bin/ldid
          else
            git clone --depth 1 https://github.com/ProcursusTeam/ldid.git /tmp/ldid
            make -C /tmp/ldid -j$(nproc)
            sudo cp /tmp/ldid/ldid /usr/local/bin/ldid
          fi

          # 2. Cài Theos & Toolchain iOS qua bộ cài chính thức trên Ubuntu 24.04
          curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos -o /tmp/install-theos
          yes "" | bash /tmp/install-theos
          test -x "$THEOS/toolchain/linux/iphone/bin/clang"

          # 3. Nạp iPhoneOS9.3.sdk (hỗ trợ chip 32-bit armv7 của iPod touch 4)
          mkdir -p "$THEOS/sdks"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/xybp888/iOS-SDKs.git /tmp/iOS-SDKs
          git -C /tmp/iOS-SDKs sparse-checkout set iPhoneOS9.3.sdk
          cp -r /tmp/iOS-SDKs/iPhoneOS9.3.sdk "$THEOS/sdks/"

      - name: Compile & Package DEB
        env:
          THEOS: /home/runner/theos
        run: |
          set -e
          make FINALPACKAGE=1 ADDITIONAL_CFLAGS="-Wno-deprecated-declarations"
          RAW_APP=$(find .theos/obj -maxdepth 3 -name "*.app" -type d | head -n 1)
          test -n "$RAW_APP"

          mkdir -p deb_pkg/DEBIAN deb_pkg/Applications/iPodClassicU2.app
          cp -r "$RAW_APP/"* deb_pkg/Applications/iPodClassicU2.app/

          PLIST_PATH=$(find . -maxdepth 3 -name "Info.plist" -not -path "./.theos/*" -not -path "./deb_pkg/*" | head -n 1)
          test -n "$PLIST_PATH"
          cp "$PLIST_PATH" deb_pkg/Applications/iPodClassicU2.app/Info.plist
          cp Icon*.png deb_pkg/Applications/iPodClassicU2.app/ 2>/dev/null || true

          ldid -S deb_pkg/Applications/iPodClassicU2.app/iPodClassicU2
          chmod -R 0755 deb_pkg/Applications/iPodClassicU2.app
          chmod 0644 deb_pkg/Applications/iPodClassicU2.app/Info.plist

          cat << 'EOF' > deb_pkg/DEBIAN/control
          Package: com.u2.ipodclassic
          Name: iPod Classic U2
          Version: 1.0.0
          Architecture: iphoneos-arm
          Description: iPod Classic U2 Edition for iOS 6
          Maintainer: User
          Author: User
          Section: Utilities
          EOF
          chmod 0755 deb_pkg/DEBIAN

          dpkg-deb -Zgzip -b deb_pkg iPodClassicU2.deb

      - uses: actions/upload-artifact@v4
        with:
          name: iPodClassicU2-DEB
          path: iPodClassicU2.deb
